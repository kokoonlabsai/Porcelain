# DigitalOcean App Platform spec: free static frontend + ~$5/month API container on one domain. Data lives in MongoDB Atlas.
# Set repo below to your GitHub repo, then create the app from this file.
name: derma-clinic
region: blr

static_sites:
  - name: web
    github:
      repo: kokoonlabsai/porcelain
      branch: main
      deploy_on_push: true
    source_dir: client
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html

services:
  - name: api
    github:
      repo: kokoonlabsai/porcelain
      branch: main
      deploy_on_push: true
    source_dir: server
    dockerfile_path: server/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    envs:
      - key: TZ
        value: Asia/Kolkata
      - key: JWT_SECRET
        type: SECRET
        value: change-me-to-a-long-random-string
      - key: MONGODB_URI              # Atlas → Connect → Drivers; add the database name after the host
        type: SECRET
        value: mongodb+srv://user:password@cluster0.xxxxx.mongodb.net/clinic?retryWrites=true&w=majority
      - key: ADMIN_PHONE              # the first admin login is created from these on start-up
        value: "+91 90000 00001"
      - key: ADMIN_PASSWORD
        type: SECRET
        value: change-me
      - key: APP_URL                  # used for links in emails
        value: https://your-clinic-domain.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_USER
        type: SECRET
        value: clinic@example.com
      - key: SMTP_PASS
        type: SECRET
        value: app-password

ingress:
  rules:
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    - component:
        name: web
      match:
        path:
          prefix: /
